name: Build unsigned iOS for SideStore

# Builds an unsigned .ipa and publishes it as a GitHub release.
# SideStore signs it with your own Apple ID when you install it.
#
# Run it from the Actions tab, or with:
#   gh workflow run ios-sideload.yml
#
# Manual-only on purpose: pushing a tag would also start the
# upstream release workflows, which need secrets this fork lacks.
# A release created with GITHUB_TOKEN does not trigger them.

on:
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -runFirstLaunch
          xcodebuild -downloadPlatform iOS -version 26.3

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          cache-flutter: false
          cache-pub: false
          no-save-caches: true

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - name: Build for iOS without code signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FLAVOR="Sideload" \
            --dart-define=UPDATE_CHECK="false"

      - name: Package IPA
        id: package
        run: |
          buildName=$(sed -n "s/^const buildName = '\(.*\)';/\1/p" lib/data/version.dart)
          tag="ipad-v${buildName}-${GITHUB_RUN_NUMBER}"
          ipaPath="Saber_v${buildName}_unsigned.ipa"

          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "$ipaPath" Payload

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ipaPath=$ipaPath" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        run: |
          gh release create "$TAG" "$IPA_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --prerelease \
            --notes "Unsigned iPad build of ${GITHUB_SHA::8}. Install it with SideStore: open this page in Safari on the iPad, download the .ipa, then share it to SideStore."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
          IPA_PATH: ${{ steps.package.outputs.ipaPath }}
